
<div class="panel panel-default">
    <div class="panel-heading">
        <h4>{{contact?.name}}</h4>
        <img alt="{{contact?.name}}" src="{{contact?.imageUrl}}" class="img-responsive img-circle">
        <div>
            <a href="#" class="btn btn-primary btn-sm" [routerLink]="[contact.id, 'edit']" >Edit</a>
            <a href="#" class="btn btn-danger btn-sm" (click)="onDelete()">Delete</a>
        </div>
    </div>
    <div class="panel-body">
        <p><strong>Email:</strong> {{contact?.email}}</p>
        <p><strong>Phone:</strong> {{contact?.phone}}</p>
    </div>
</div>
