<div class="row">
    <div class="col-md-5">
        <app-recipe-list 
            (recipeSelected)="selectedRecipe = $event"></app-recipe-list>
    </div>
    <div class="col-md-7">
        <app-recipe-details *ngIf="selectedRecipe: else infoText"></app-recipe-details>
        <ng-template>
            <p>Please select a recipe!</p>
        </ng-template>
    </div>
</div>
